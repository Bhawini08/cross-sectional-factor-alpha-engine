name: factor-research-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python scripts/run_research.py --mode synthetic --focus SPY --outdir ci_results
